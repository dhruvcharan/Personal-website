<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 16" width="64" height="32" shape-rendering="crispEdges">
  <!-- Key Head / Handle Outer Outline -->
  <rect x="1" y="4" width="10" height="8" fill="#4a3000"/>
  <rect x="2" y="3" width="8" height="10" fill="#4a3000"/>
  
  <!-- Key Head Outer Gold Ring -->
  <rect x="2" y="4" width="8" height="8" fill="#e6a100"/>
  <rect x="3" y="3" width="6" height="10" fill="#e6a100"/>
  
  <!-- Key Head Highlights -->
  <rect x="3" y="4" width="6" height="2" fill="#fff099"/>
  <rect x="3" y="4" width="2" height="6" fill="#ffd700"/>

  <!-- Key Head Inner Hole (Transparent) -->
  <rect x="5" y="6" width="2" height="4" fill="none"/>

  <!-- Key Shaft Outer Outline -->
  <rect x="10" y="7" width="20" height="4" fill="#4a3000"/>
  <rect x="29" y="8" width="2" height="5" fill="#4a3000"/>
  <rect x="23" y="8" width="2" height="4" fill="#4a3000"/>
  <rect x="19" y="8" width="2" height="3" fill="#4a3000"/>

  <!-- Key Shaft Gold Body -->
  <rect x="10" y="7" width="19" height="2" fill="#ffd700"/>
  <rect x="10" y="8" width="19" height="1" fill="#e6a100"/>
  <rect x="10" y="7" width="19" height="1" fill="#fff099"/>

  <!-- Key Teeth -->
  <rect x="23" y="9" width="2" height="3" fill="#ffd700"/>
  <rect x="24" y="9" width="1" height="3" fill="#e6a100"/>
  <rect x="28" y="9" width="2" height="4" fill="#ffd700"/>
  <rect x="29" y="9" width="1" height="4" fill="#e6a100"/>

  <!-- Subtle Shading -->
  <rect x="2" y="11" width="8" height="1" fill="#8c5a00"/>
  <rect x="10" y="9" width="19" height="1" fill="#8c5a00"/>
</svg>
